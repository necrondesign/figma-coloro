<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coloro</title>
<link rel="stylesheet" href="/app.css">
<script>try{if(localStorage.getItem("coloro.theme")==="light")document.documentElement.classList.add("pre-light")}catch(e){}</script>
</head>
<body>

<aside class="panel" id="left" aria-label="Projects and files">
  <div class="ph">
    <span class="brand">coloro</span><span class="grow"></span>
    <button class="b sm" id="newProj" title="Create a new project"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>New project</button>
    <button class="ib collapse" title="Collapse panel" data-collapse="l"><svg class="i" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
  </div>
  <div class="projwrap">
    <button class="proj" id="projBtn" aria-haspopup="menu"><span class="pdot" id="projDot"></span>
      <span class="grow"><b id="projName">—</b><br><span class="muted" id="projMeta"></span></span>
      <svg class="i" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
    <div class="menu" id="projMenu" role="menu"></div>
  </div>
  <div class="sec">Files<span class="grow"></span>
    <button class="ib sm" title="Select all files" id="allFiles"><svg class="i" viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg></button>
    <button class="ib sm" title="Add files" id="addBtn"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button></div>
  <div class="scroll" id="files"></div>
  <div class="pf">
    <div class="total"><i id="totalBar"></i></div>
    <div class="row"><span class="label grow" id="jobStatus"></span>
      <a class="ib" id="export" href="/api/export" download title="Download the report: one HTML file to share" hidden><svg class="i" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg></a>
      <button class="b main" id="updBtn"></button></div>
  </div>
</aside>
<button class="mini" id="miniL" data-open="l" aria-label="Projects and files">
  <svg class="i" viewBox="0 0 16 16"><path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z"/></svg>
  <svg class="ring" viewBox="0 0 50 50"><circle cx="25" cy="25" r="22" class="ring-bg"/><circle id="ringL" cx="25" cy="25" r="22" class="ring-fg"/></svg>
  <span class="badge" id="badgeL"></span><span class="tip" id="tipL"></span>
</button>

<aside class="panel stack" id="right" aria-label="View options">
  <div class="blk"><div class="ph">
    <span class="title">View</span><span class="grow"></span>
    <button class="ib" title="Toggle theme" id="themeBtn"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5Z" fill="currentColor"/></svg></button>
    <button class="ib" title="Settings: Figma access, token library, updates" id="gear"><svg class="i" viewBox="0 0 16 16"><path d="M6.9 1.8h2.2l.4 1.8a4.8 4.8 0 0 1 1.3.75l1.75-.6 1.1 1.9-1.4 1.2a4.8 4.8 0 0 1 0 1.5l1.4 1.2-1.1 1.9-1.75-.6a4.8 4.8 0 0 1-1.3.75l-.4 1.8H6.9l-.4-1.8a4.8 4.8 0 0 1-1.3-.75l-1.75.6-1.1-1.9 1.4-1.2a4.8 4.8 0 0 1 0-1.5l-1.4-1.2 1.1-1.9 1.75.6a4.8 4.8 0 0 1 1.3-.75z"/><circle cx="8" cy="8" r="2"/></svg></button>
    <button class="ib collapse" title="Collapse all three blocks" data-collapse="r"><svg class="i" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
  </div></div>
  <div class="blk"><div class="types" id="types" role="tablist" aria-label="Content type"></div></div>
  <div class="blk grow-blk"><div class="scroll">
    <div class="tname" id="tname"></div>
    <div id="show"></div>
    <div class="sec">Include<span class="grow"></span><button class="link" id="resetF" hidden>Reset</button></div>
    <div id="include"></div>
  </div></div>
</aside>
<button class="mini" id="miniR" data-open="r" aria-label="View options">
  <svg class="i" viewBox="0 0 16 16"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>
  <span class="badge blue" id="badgeR"></span><span class="tip" id="tipR"></span>
</button>

<main id="center">
  <form class="search" id="search" autocomplete="off">
    <svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
    <input name="q" id="q" placeholder="Search text, layer or component names" aria-label="Search">
    <span class="dims"><input name="w" placeholder="W" inputmode="decimal" aria-label="Width"><span>×</span><input name="h" placeholder="H" inputmode="decimal" aria-label="Height"></span>
    <button type="button" class="swbtn" id="swBtn" title="Search by color"><span id="swPrev"></span></button>
    <button type="button" class="ib" id="clearSearch" title="Clear search" hidden><svg class="i" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    <span class="kbd">/</span>
  </form>
  <div class="cpop" id="cpop" hidden>
    <div class="row"><input type="color" id="cpick" value="#ff006f"><input class="in mono" id="chex" placeholder="#RRGGBB" maxlength="9">
      <button class="ib" id="eyedrop" title="Pick a color from the screen" hidden><svg class="i" viewBox="0 0 16 16"><path d="m10 2.5 3.5 3.5-1.5 1.5L8.5 4zM9 5 3 11v2h2l6-6"/></svg></button></div>
    <label class="slider"><span>Color tolerance</span><input type="range" id="ctol" min="0" max="20" step="0.5" value="3"><b id="ctolV">3</b></label>
    <label class="check"><input type="checkbox" id="calphaOn"> Match opacity</label>
    <label class="slider"><span>Opacity</span><input type="range" id="calpha" min="0" max="100" value="100" disabled><b id="calphaV">100%</b></label>
    <div class="row"><button class="b main" id="capply">Search color</button><button class="b quiet" id="cclear">Remove color</button></div>
  </div>
  <div class="content" id="content"><div class="loading">Loading…</div></div>
</main>

<div id="toasts" aria-live="polite"></div>
<div class="tipbox" id="tipbox" hidden></div>

<div class="veil" id="veil" hidden><div class="dlg" role="dialog" aria-labelledby="dlgTitle">
  <div class="row"><h3 id="dlgTitle" class="grow">Settings</h3><button class="ib" id="closeDlg" title="Close"><svg class="i" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
  <div id="dlgBody"></div>
</div></div>

<script src="/app.js"></script>
</body>
</html>
