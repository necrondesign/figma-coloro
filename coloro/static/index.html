<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coloro</title>
<link rel="stylesheet" href="/app.css">
<script>try{if(localStorage.getItem("coloro.theme")==="light")document.documentElement.classList.add("pre-light")}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="brand">coloro</span>
    <nav class="nav" id="nav">
      <a href="#/" data-v="overview">Картина</a>
      <a href="#/colours" data-v="colours">Цвета</a>
      <a href="#/sources" data-v="sources">Источники</a>
      <a href="#/settings" data-v="settings">Настройки</a>
    </nav>
    <span class="grow"></span>
    <span class="job" id="job"></span>
    <button class="ic" id="theme" title="Светлая или тёмная тема" aria-label="Светлая или тёмная тема">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 0 16V2Z"/><path fill-rule="evenodd" d="M10 1a9 9 0 1 1 0 18 9 9 0 0 1 0-18Zm0 1.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15Z" clip-rule="evenodd"/></svg>
    </button>
  </header>
  <div class="filters" id="filters" hidden></div>
  <main id="view"><div class="loading">Загрузка…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
